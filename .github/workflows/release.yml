name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: version
        id: ver
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          case "$GOOS" in
            darwin)  pretty=mac;;
            linux)   pretty=linux;;
            windows) pretty=windows;;
          esac
          case "$GOARCH" in
            amd64) parch=x64;;
            arm64)  parch=arm64;;
          esac
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="wrack-${{ steps.ver.outputs.version }}-${pretty}-${parch}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" -o "dist/$name" .
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: wrack-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
